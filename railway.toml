# Railway deployment configuration — Rotbe Land weekly planner
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run twice on purpose: once here (before the new instance takes
# traffic) and once inside the process at boot (RUN_MIGRATIONS_ON_START=true in
# the Dockerfile). `alembic upgrade head` is idempotent, and the second pass is
# what saves a first deploy where the pre-deploy step never ran — that case used
# to produce `relation "users" does not exist` for every user.
preDeployCommand = "alembic upgrade head"
startCommand = "./docker-entrypoint.sh bot"

# Telegram long-polling requires exactly ONE active instance.
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check only applies when the service exposes PORT.
healthcheckPath = "/health"
healthcheckTimeout = 30

[deploy.multiRegionConfig]
# keep a single region: a second replica would double-consume Telegram updates

[[services]]
name = "bot"
